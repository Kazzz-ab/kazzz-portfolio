<svg viewBox="0 0 560 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clinio-title clinio-desc">
  <title id="clinio-title">Clinio Architecture</title>
  <desc id="clinio-desc">Three clinic roles using one role-scoped React SPA over an Express API with an explicit middleware chain, Prisma, and PostgreSQL</desc>

  <!-- Role lanes -->
  <rect x="16" y="34" width="86" height="30" rx="2" stroke="#3A3A38" stroke-width="0.5"/>
  <text x="59" y="53" text-anchor="middle" font-family="monospace" font-size="9" fill="#8A8A82">reception</text>
  <rect x="16" y="74" width="86" height="30" rx="2" stroke="#3A3A38" stroke-width="0.5"/>
  <text x="59" y="93" text-anchor="middle" font-family="monospace" font-size="9" fill="#8A8A82">doctor</text>
  <rect x="16" y="114" width="86" height="30" rx="2" stroke="#3A3A38" stroke-width="0.5"/>
  <text x="59" y="133" text-anchor="middle" font-family="monospace" font-size="9" fill="#8A8A82">admin</text>

  <!-- Role arrows into SPA -->
  <line x1="103" y1="49" x2="130" y2="78" stroke="#3A3A38" stroke-width="0.5"/>
  <line x1="103" y1="89" x2="130" y2="89" stroke="#3A3A38" stroke-width="0.5"/>
  <line x1="103" y1="129" x2="130" y2="100" stroke="#3A3A38" stroke-width="0.5"/>
  <polygon points="130,86 135,89 130,92" fill="#3A3A38"/>

  <!-- React SPA -->
  <rect x="136" y="48" width="108" height="84" rx="2" stroke="#B89968" stroke-width="0.5"/>
  <text x="190" y="70" text-anchor="middle" font-family="monospace" font-size="9" fill="#B89968">React + Vite SPA</text>
  <line x1="146" y1="78" x2="234" y2="78" stroke="#3A3A38" stroke-width="0.5"/>
  <text x="190" y="93" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">role-gated routes</text>
  <text x="190" y="106" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">booking grid</text>
  <text x="190" y="119" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">invoice PDF</text>

  <!-- Arrow to API -->
  <line x1="245" y1="90" x2="272" y2="90" stroke="#3A3A38" stroke-width="0.5"/>
  <polygon points="272,87 277,90 272,93" fill="#3A3A38"/>

  <!-- Express API with middleware chain -->
  <rect x="278" y="34" width="120" height="112" rx="2" stroke="#B89968" stroke-width="0.5"/>
  <text x="338" y="54" text-anchor="middle" font-family="monospace" font-size="9" fill="#B89968">Express API</text>
  <line x1="288" y1="62" x2="388" y2="62" stroke="#3A3A38" stroke-width="0.5"/>
  <text x="338" y="77" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">helmet · cors</text>
  <text x="338" y="90" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">rate limit</text>
  <text x="338" y="103" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">audit capture</text>
  <text x="338" y="116" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">JWT + requireRole</text>
  <text x="338" y="129" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">routes</text>

  <!-- Arrow to Prisma -->
  <line x1="399" y1="90" x2="424" y2="90" stroke="#3A3A38" stroke-width="0.5"/>
  <polygon points="424,87 429,90 424,93" fill="#3A3A38"/>

  <!-- Prisma -->
  <rect x="430" y="62" width="50" height="56" rx="2" stroke="#B89968" stroke-width="0.5"/>
  <text x="455" y="86" text-anchor="middle" font-family="monospace" font-size="9" fill="#B89968">Prisma</text>
  <text x="455" y="99" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">typed</text>
  <text x="455" y="110" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">schema</text>

  <!-- Arrow to Postgres -->
  <line x1="481" y1="90" x2="500" y2="90" stroke="#3A3A38" stroke-width="0.5"/>
  <polygon points="500,87 505,90 500,93" fill="#3A3A38"/>

  <!-- PostgreSQL -->
  <rect x="506" y="56" width="44" height="68" rx="2" stroke="#3A3A38" stroke-width="0.5"/>
  <text x="528" y="80" text-anchor="middle" font-family="monospace" font-size="8" fill="#8A8A82">Postgre</text>
  <text x="528" y="91" text-anchor="middle" font-family="monospace" font-size="8" fill="#8A8A82">SQL</text>
  <text x="528" y="108" text-anchor="middle" font-family="monospace" font-size="8" fill="#5A5A55">5 models</text>

  <!-- Data model strip -->
  <rect x="136" y="170" width="262" height="28" rx="2" stroke="#3A3A38" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="267" y="188" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">Users · Patients · Doctors · Appointments · Invoices</text>
  <line x1="267" y1="170" x2="267" y2="151" stroke="#3A3A38" stroke-width="0.5" stroke-dasharray="3 2"/>

  <!-- Resend -->
  <rect x="430" y="170" width="120" height="28" rx="2" stroke="#3A3A38" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="490" y="188" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">Resend · reminders</text>
  <line x1="398" y1="140" x2="470" y2="168" stroke="#3A3A38" stroke-width="0.5" stroke-dasharray="3 2"/>
</svg>
