<svg viewBox="0 0 560 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lexa-title lexa-desc">
  <title id="lexa-title">Lexa Architecture</title>
  <desc id="lexa-desc">Case-centric domain model: clients and attorneys relate to a numbered matter with an enforced status lifecycle, billing-aware invoices, and a full audit trail</desc>

  <!-- Client entity -->
  <rect x="40" y="20" width="120" height="50" rx="2" stroke="#3A3A38" stroke-width="0.5"/>
  <text x="100" y="40" text-anchor="middle" font-family="monospace" font-size="9" fill="#8A8A82">Client</text>
  <text x="100" y="56" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">intake · conflicts</text>

  <!-- Attorney entity -->
  <rect x="400" y="20" width="120" height="50" rx="2" stroke="#3A3A38" stroke-width="0.5"/>
  <text x="460" y="40" text-anchor="middle" font-family="monospace" font-size="9" fill="#8A8A82">Attorney</text>
  <text x="460" y="56" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">bar no. · rate</text>

  <!-- Arrows into Case -->
  <line x1="120" y1="71" x2="218" y2="100" stroke="#3A3A38" stroke-width="0.5"/>
  <polygon points="216,96 223,101 217,103" fill="#3A3A38"/>
  <line x1="440" y1="71" x2="342" y2="100" stroke="#3A3A38" stroke-width="0.5"/>
  <polygon points="343,103 337,101 344,96" fill="#3A3A38"/>

  <!-- Case (hub) -->
  <rect x="210" y="86" width="140" height="64" rx="2" stroke="#B89968" stroke-width="0.5"/>
  <text x="280" y="106" text-anchor="middle" font-family="monospace" font-size="10" fill="#B89968" letter-spacing="0.04em">Case</text>
  <line x1="220" y1="113" x2="340" y2="113" stroke="#3A3A38" stroke-width="0.5"/>
  <text x="280" y="128" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">LX-YYYY-NNNN</text>
  <text x="280" y="141" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">priority · court date</text>

  <!-- Arrow to Invoice -->
  <line x1="351" y1="118" x2="408" y2="118" stroke="#3A3A38" stroke-width="0.5"/>
  <polygon points="408,115 413,118 408,121" fill="#3A3A38"/>

  <!-- Invoice -->
  <rect x="414" y="92" width="126" height="56" rx="2" stroke="#B89968" stroke-width="0.5"/>
  <text x="477" y="111" text-anchor="middle" font-family="monospace" font-size="9" fill="#B89968">Invoice</text>
  <text x="477" y="126" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">billingType</text>
  <text x="477" y="139" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">line items · hours</text>

  <!-- Lifecycle pipeline -->
  <line x1="280" y1="151" x2="280" y2="172" stroke="#3A3A38" stroke-width="0.5"/>
  <polygon points="277,169 280,175 283,169" fill="#3A3A38"/>

  <rect x="92" y="178" width="56" height="24" rx="2" stroke="#B89968" stroke-width="0.5"/>
  <text x="120" y="194" text-anchor="middle" font-family="monospace" font-size="9" fill="#B89968">open</text>
  <line x1="149" y1="190" x2="166" y2="190" stroke="#3A3A38" stroke-width="0.5"/>
  <polygon points="166,187 171,190 166,193" fill="#3A3A38"/>

  <rect x="172" y="178" width="60" height="24" rx="2" stroke="#B89968" stroke-width="0.5"/>
  <text x="202" y="194" text-anchor="middle" font-family="monospace" font-size="9" fill="#B89968">active</text>
  <line x1="233" y1="190" x2="250" y2="190" stroke="#3A3A38" stroke-width="0.5"/>
  <polygon points="250,187 255,190 250,193" fill="#3A3A38"/>

  <rect x="256" y="178" width="66" height="24" rx="2" stroke="#B89968" stroke-width="0.5"/>
  <text x="289" y="194" text-anchor="middle" font-family="monospace" font-size="9" fill="#B89968">pending</text>
  <line x1="323" y1="190" x2="340" y2="190" stroke="#3A3A38" stroke-width="0.5"/>
  <polygon points="340,187 345,190 340,193" fill="#3A3A38"/>

  <rect x="346" y="178" width="60" height="24" rx="2" stroke="#3A3A38" stroke-width="0.5"/>
  <text x="376" y="194" text-anchor="middle" font-family="monospace" font-size="9" fill="#8A8A82">closed</text>

  <!-- on-hold branch -->
  <rect x="172" y="214" width="60" height="22" rx="2" stroke="#3A3A38" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="202" y="229" text-anchor="middle" font-family="monospace" font-size="8" fill="#5A5A55">on-hold</text>
  <line x1="202" y1="203" x2="202" y2="213" stroke="#3A3A38" stroke-width="0.5" stroke-dasharray="3 2"/>

  <text x="430" y="194" font-family="monospace" font-size="8" fill="#5A5A55">transitions enforced</text>
  <text x="430" y="205" font-family="monospace" font-size="8" fill="#5A5A55">server-side</text>

  <!-- Audit trail strip -->
  <rect x="40" y="86" width="118" height="64" rx="2" stroke="#3A3A38" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="99" y="108" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">audit trail</text>
  <text x="99" y="121" text-anchor="middle" font-family="monospace" font-size="8" fill="#5A5A55">every write:</text>
  <text x="99" y="133" text-anchor="middle" font-family="monospace" font-size="8" fill="#5A5A55">actor · action</text>
  <line x1="159" y1="118" x2="204" y2="118" stroke="#3A3A38" stroke-width="0.5" stroke-dasharray="3 2"/>
</svg>
