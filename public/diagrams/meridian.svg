<svg viewBox="0 0 500 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="meridian-title meridian-desc">
  <title id="meridian-title">Meridian Architecture</title>
  <desc id="meridian-desc">Webflow site with serverless AI consultation function: Webflow form posts to Vercel function which calls Gemini and returns acknowledgement</desc>

  <!-- Webflow site -->
  <rect x="20" y="60" width="120" height="100" rx="2" stroke="#B89968" stroke-width="0.5"/>
  <text x="80" y="86" text-anchor="middle" font-family="monospace" font-size="9" fill="#B89968">Webflow</text>
  <line x1="30" y1="93" x2="130" y2="93" stroke="#3A3A38" stroke-width="0.5"/>
  <text x="80" y="108" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">Services CMS</text>
  <text x="80" y="120" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">Case Studies</text>
  <text x="80" y="132" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">Team / Testimonials</text>
  <text x="80" y="144" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">Contact Form ↓</text>

  <!-- Arrow: form submit -->
  <line x1="141" y1="140" x2="195" y2="140" stroke="#B89968" stroke-width="0.5"/>
  <polygon points="195,137 200,140 195,143" fill="#B89968"/>
  <text x="168" y="133" text-anchor="middle" font-family="monospace" font-size="8" fill="#5A5A55">POST</text>

  <!-- Vercel function -->
  <rect x="201" y="96" width="120" height="88" rx="2" stroke="#B89968" stroke-width="0.5"/>
  <text x="261" y="118" text-anchor="middle" font-family="monospace" font-size="9" fill="#B89968">/api/consult</text>
  <text x="261" y="131" text-anchor="middle" font-family="monospace" font-size="9" fill="#B89968">Vercel fn</text>
  <line x1="211" y1="138" x2="311" y2="138" stroke="#3A3A38" stroke-width="0.5"/>
  <text x="261" y="153" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">validate</text>
  <text x="261" y="165" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">rate-limit</text>
  <text x="261" y="177" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">honeypot</text>

  <!-- Arrow to Gemini -->
  <line x1="322" y1="130" x2="370" y2="115" stroke="#3A3A38" stroke-width="0.5"/>
  <polygon points="367,112 373,114 370,120" fill="#3A3A38"/>

  <!-- Gemini -->
  <rect x="372" y="88" width="88" height="56" rx="2" stroke="#3A3A38" stroke-width="0.5"/>
  <text x="416" y="112" text-anchor="middle" font-family="monospace" font-size="9" fill="#8A8A82">Gemini</text>
  <text x="416" y="125" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">acknowledge</text>
  <text x="416" y="138" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">+ route</text>

  <!-- Arrow back: acknowledgement -->
  <line x1="322" y1="150" x2="370" y2="155" stroke="#B89968" stroke-width="0.5" stroke-dasharray="3 2"/>
  <polygon points="367,152 373,156 369,161" fill="#B89968"/>
  <text x="348" y="165" text-anchor="middle" font-family="monospace" font-size="8" fill="#B89968">ack</text>

  <!-- Arrow: response to visitor -->
  <line x1="201" y1="130" x2="165" y2="110" stroke="#3A3A38" stroke-width="0.5"/>
  <polygon points="162,107 165,114 169,108" fill="#3A3A38"/>

  <!-- CRM optional -->
  <rect x="372" y="168" width="88" height="36" rx="2" stroke="#3A3A38" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="416" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">CRM / Sheet</text>
  <text x="416" y="197" text-anchor="middle" font-family="monospace" font-size="8" fill="#5A5A55">(optional)</text>
  <line x1="416" y1="144" x2="416" y2="167" stroke="#3A3A38" stroke-width="0.5" stroke-dasharray="2 2"/>
  <polygon points="413,164 416,170 419,164" fill="#3A3A38"/>

  <!-- Calendly embed note -->
  <rect x="20" y="175" width="120" height="28" rx="2" stroke="#3A3A38" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="80" y="193" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">Calendly embed</text>
</svg>
