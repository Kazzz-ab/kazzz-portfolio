<svg viewBox="0 0 500 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="meridian-title meridian-desc">
  <title id="meridian-title">Meridian Architecture</title>
  <desc id="meridian-desc">A hand-coded static site driven by one config file posts the contact form to a single Vercel serverless function, which runs CORS, a per-IP rate limit, a honeypot and zod validation, then calls Gemini 1.5 Flash and returns an on-brand acknowledgement to the visitor plus a structured routing summary; the routing summary optionally pipes to a CRM, Slack or sheet, and booking is a drop-in scheduler slot.</desc>

  <!-- Static site -->
  <rect x="18" y="52" width="132" height="116" rx="2" stroke="#B89968" stroke-width="0.5"/>
  <text x="84" y="70" text-anchor="middle" font-family="monospace" font-size="9" fill="#B89968">Static site</text>
  <line x1="28" y1="77" x2="140" y2="77" stroke="#3A3A38" stroke-width="0.5"/>
  <text x="84" y="93" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">config.js · 5 skins</text>
  <text x="84" y="107" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">render.js</text>
  <text x="84" y="121" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">style.css</text>
  <text x="84" y="145" text-anchor="middle" font-family="monospace" font-size="9" fill="#B89968">contact form ↓</text>

  <!-- Arrow back: reply to visitor (fn -> site) -->
  <line x1="197" y1="116" x2="154" y2="112" stroke="#3A3A38" stroke-width="0.5"/>
  <polygon points="159,109 152,112 159,115" fill="#3A3A38"/>
  <text x="175" y="107" text-anchor="middle" font-family="monospace" font-size="8" fill="#5A5A55">reply</text>

  <!-- Arrow: form submit (site -> fn) -->
  <line x1="150" y1="140" x2="195" y2="140" stroke="#B89968" stroke-width="0.5"/>
  <polygon points="195,137 200,140 195,143" fill="#B89968"/>
  <text x="172" y="135" text-anchor="middle" font-family="monospace" font-size="8" fill="#B89968">POST</text>

  <!-- Vercel function -->
  <rect x="198" y="92" width="126" height="92" rx="2" stroke="#B89968" stroke-width="0.5"/>
  <text x="261" y="110" text-anchor="middle" font-family="monospace" font-size="9" fill="#B89968">/api/consult</text>
  <text x="261" y="123" text-anchor="middle" font-family="monospace" font-size="9" fill="#B89968">Vercel fn</text>
  <line x1="208" y1="130" x2="314" y2="130" stroke="#3A3A38" stroke-width="0.5"/>
  <text x="261" y="145" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">CORS · rate-limit</text>
  <text x="261" y="157" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">honeypot</text>
  <text x="261" y="169" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">validate · zod</text>

  <!-- Arrow to Gemini (request) -->
  <line x1="324" y1="116" x2="372" y2="106" stroke="#3A3A38" stroke-width="0.5"/>
  <polygon points="369,103 374,106 370,111" fill="#3A3A38"/>

  <!-- Gemini -->
  <rect x="374" y="86" width="104" height="58" rx="2" stroke="#3A3A38" stroke-width="0.5"/>
  <text x="426" y="106" text-anchor="middle" font-family="monospace" font-size="9" fill="#8A8A82">Gemini 1.5 Flash</text>
  <text x="426" y="121" text-anchor="middle" font-family="monospace" font-size="8" fill="#5A5A55">acknowledgement</text>
  <text x="426" y="133" text-anchor="middle" font-family="monospace" font-size="8" fill="#5A5A55">+ routingSummary</text>

  <!-- Arrow back: ack + route (Gemini -> fn) -->
  <line x1="372" y1="130" x2="327" y2="148" stroke="#B89968" stroke-width="0.5" stroke-dasharray="3 2"/>
  <polygon points="332,145 325,148 331,153" fill="#B89968"/>
  <text x="350" y="166" text-anchor="middle" font-family="monospace" font-size="7" fill="#B89968">ack + route</text>

  <!-- routingSummary pipe (-> CRM) -->
  <line x1="426" y1="144" x2="426" y2="166" stroke="#3A3A38" stroke-width="0.5" stroke-dasharray="2 2"/>
  <polygon points="423,163 426,169 429,163" fill="#3A3A38"/>

  <!-- CRM optional -->
  <rect x="374" y="168" width="104" height="36" rx="2" stroke="#3A3A38" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="426" y="185" text-anchor="middle" font-family="monospace" font-size="8" fill="#5A5A55">CRM · Slack · Sheet</text>
  <text x="426" y="197" text-anchor="middle" font-family="monospace" font-size="7" fill="#5A5A55">(optional)</text>

  <!-- Booking slot -->
  <rect x="18" y="180" width="132" height="28" rx="2" stroke="#3A3A38" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="84" y="192" text-anchor="middle" font-family="monospace" font-size="8" fill="#5A5A55">Booking · drop-in slot</text>
  <text x="84" y="203" text-anchor="middle" font-family="monospace" font-size="7" fill="#5A5A55">Calendly / Cal.com</text>
</svg>
