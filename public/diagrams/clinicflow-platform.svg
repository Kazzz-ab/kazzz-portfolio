<svg viewBox="0 0 520 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clinic-title clinic-desc">
  <title id="clinic-title">ClinicFlow + CounselFlow Platform Architecture</title>
  <desc id="clinic-desc">Two product frontends (ClinicFlow healthcare, CounselFlow legal) on a shared Express + Prisma + PostgreSQL platform</desc>

  <!-- ClinicFlow product box -->
  <rect x="20" y="20" width="180" height="90" rx="2" stroke="#B89968" stroke-width="0.5"/>
  <text x="110" y="42" text-anchor="middle" font-family="monospace" font-size="10" fill="#B89968" letter-spacing="0.04em">ClinicFlow</text>
  <line x1="30" y1="50" x2="190" y2="50" stroke="#3A3A38" stroke-width="0.5"/>
  <text x="110" y="66" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">React · Vite · Tailwind</text>
  <text x="110" y="79" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">Patients · Doctors</text>
  <text x="110" y="92" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">Appointments · Invoices</text>

  <!-- CounselFlow product box -->
  <rect x="320" y="20" width="180" height="90" rx="2" stroke="#B89968" stroke-width="0.5"/>
  <text x="410" y="42" text-anchor="middle" font-family="monospace" font-size="10" fill="#B89968" letter-spacing="0.04em">CounselFlow</text>
  <line x1="330" y1="50" x2="490" y2="50" stroke="#3A3A38" stroke-width="0.5"/>
  <text x="410" y="66" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">React · Vite · Tailwind</text>
  <text x="410" y="79" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">Clients · Attorneys</text>
  <text x="410" y="92" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">Cases · Invoices</text>

  <!-- Connecting lines to platform -->
  <line x1="110" y1="111" x2="110" y2="140" stroke="#3A3A38" stroke-width="0.5"/>
  <line x1="110" y1="140" x2="260" y2="140" stroke="#3A3A38" stroke-width="0.5"/>
  <line x1="410" y1="111" x2="410" y2="140" stroke="#3A3A38" stroke-width="0.5"/>
  <line x1="410" y1="140" x2="260" y2="140" stroke="#3A3A38" stroke-width="0.5"/>
  <line x1="260" y1="140" x2="260" y2="150" stroke="#3A3A38" stroke-width="0.5"/>
  <polygon points="257,147 260,153 263,147" fill="#3A3A38"/>

  <!-- Shared platform bar -->
  <rect x="60" y="155" width="400" height="50" rx="2" stroke="#B89968" stroke-width="0.5"/>
  <text x="260" y="175" text-anchor="middle" font-family="monospace" font-size="9" fill="#B89968" letter-spacing="0.06em">SHARED PLATFORM</text>
  <text x="260" y="191" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A5A55">Express · Prisma ORM · PostgreSQL · JWT auth · Role-based middleware</text>
</svg>
